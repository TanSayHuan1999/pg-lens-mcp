services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pglens
      POSTGRES_PASSWORD: pglens
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pglens -d shop"]
      interval: 2s
      timeout: 2s
      retries: 10
